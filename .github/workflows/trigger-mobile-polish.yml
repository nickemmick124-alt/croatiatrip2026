name: Trigger mobile itinerary polish

on:
  push:
    paths:
      - '.github/workflows/trigger-mobile-polish.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated polish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-mobile-polish.yml --repo "$GITHUB_REPOSITORY" --ref main
