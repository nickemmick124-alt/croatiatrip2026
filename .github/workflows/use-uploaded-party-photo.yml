name: Use uploaded party photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Use uploaded party photo for Thursday Hvar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Day 7 imagery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_thumb = '<span><strong>Day 7</strong><small>Thu, Aug 20</small><em>Hvar</em></span>\n      <img src="day5.webp" alt="" loading="lazy" decoding="async">'
          new_thumb = '<span><strong>Day 7</strong><small>Thu, Aug 20</small><em>Hvar</em></span>\n      <img src="4ABC9714-8A93-464D-8D3A-98DD8D95F828.png" alt="" loading="lazy" decoding="async">'
          old_main = '<img class="photo" src="day5.webp" alt="Dress-up dinner · late-night club" loading="lazy" decoding="async">'
          new_main = '<img class="photo" src="4ABC9714-8A93-464D-8D3A-98DD8D95F828.png" alt="Thursday Hvar dinner and late-night club" loading="lazy" decoding="async">'
          if old_thumb not in s or old_main not in s:
              raise SystemExit('Expected Day 7 image references not found; refusing to publish')
          s = s.replace(old_thumb, new_thumb, 1).replace(old_main, new_main, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded party photo for Thursday Hvar"
          git push
