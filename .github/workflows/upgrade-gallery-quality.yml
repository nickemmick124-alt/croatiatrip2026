name: Upgrade Croatia gallery quality
on:
  push:
    paths:
      - 'image-chunks/HQ_READY'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch gallery to stable embedded images
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          b1 = Path('image-chunks/photo1.b64').read_text().strip()
          b2 = Path('image-chunks/photo2.b64').read_text().strip()
          b3 = Path('image-chunks/photo3.b64').read_text().strip()

          s = s.replace(
              '<img class="loading" data-b64="image-chunks/photo1.b64" alt="" aria-label="Friends at dinner aboard the yacht">',
              '<img src="data:image/webp;base64,' + b1 + '" alt="Friends at dinner aboard the yacht" decoding="async">'
          )
          s = s.replace(
              '<img class="loading" data-b64="image-chunks/photo2.b64" alt="" aria-label="Sunset drink on the yacht">',
              '<img src="data:image/webp;base64,' + b2 + '" alt="Sunset drink on the yacht" decoding="async">'
          )
          s = s.replace(
              '<img class="loading" data-b64="image-chunks/photo3.b64" alt="" aria-label="Friends relaxing with wine on deck">',
              '<img src="data:image/webp;base64,' + b3 + '" alt="Friends relaxing with wine on deck" decoding="async">'
          )

          polish = '''
/* gallery-polish-v2 */
.live-grid{max-width:1180px;margin:0 auto;padding:14px;gap:14px;align-items:stretch}
.live-shot{margin:0;min-height:0;aspect-ratio:4/5;border-radius:18px;background:#102f43;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.live-shot:nth-child(3){aspect-ratio:4/3}
.live-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:none;transform:none;image-rendering:auto}
.live-shot:after{inset:52% 0 0;background:linear-gradient(transparent,rgba(3,18,30,.90))}
.live-caption{left:16px;right:16px;bottom:15px}
@media(max-width:800px){.live-grid{grid-template-columns:1fr 1fr;padding:12px;gap:12px}.live-shot{aspect-ratio:4/5;min-height:0}.live-shot:nth-child(3){grid-column:1/-1;aspect-ratio:16/10;min-height:0}}
@media(max-width:520px){.live-head{padding:22px 20px 18px;gap:12px}.live-grid{grid-template-columns:1fr;padding:10px;gap:12px}.live-shot,.live-shot:last-child,.live-shot:nth-child(3){grid-column:auto;width:100%;height:auto;min-height:0;aspect-ratio:4/5;border-radius:16px}.live-shot:nth-child(3){aspect-ratio:4/3}.live-caption{left:14px;right:14px;bottom:13px}.live-caption strong{font-size:1.1rem;line-height:1.08}.live-caption span{font-size:.61rem;line-height:1.2}.fun-update{margin:2px 10px 12px;padding:15px 16px}.photo-note{padding:0 14px 18px}}
'''
          if '/* gallery-polish-v2 */' not in s:
              s = s.replace('</style>', polish + '</style>')

          loader = "<script>document.querySelectorAll('[data-b64]').forEach(async img=>{try{const b=await fetch(img.dataset.b64,{cache:'no-store'}).then(r=>r.text());img.src='data:image/webp;base64,'+b.trim();img.classList.remove('loading')}catch(e){img.classList.remove('loading');img.style.opacity='.18'}});</script>"
          s = s.replace(loader, '')
          p.write_text(s)
      - name: Commit quality upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Stabilize and polish live gallery photos"
          git push
