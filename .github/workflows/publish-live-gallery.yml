name: Publish live Croatia gallery
on:
  push:
    paths:
      - 'image-chunks/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live photos and updates
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="photos-updates"' not in s:
              s=s.replace('<a href="#travel">Travel Info</a></nav>','<a href="#travel">Travel Info</a><a href="#photos-updates">Photos & Updates</a></nav>')
              s=s.replace('<div class="hero-rule"></div></div>','<div class="hero-rule"></div><a class="photo-jump" href="#photos-updates">📸 Photos & Updates · LIVE</a></div>')
              css='''\n.photo-jump{display:inline-flex;margin-top:22px;background:#f0bc63;color:#102b42;padding:11px 17px;border-radius:999px;font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 28px rgba(0,0,0,.18)}\n.live-gallery{margin-top:22px;background:#071f34;color:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.live-head{padding:28px 30px 22px;display:flex;gap:20px;justify-content:space-between;align-items:end;background:linear-gradient(120deg,#071f34,#0d4660)}.live-kicker{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#f0bc63}.live-head h2{font:400 clamp(2.3rem,4.5vw,4rem)/1 Georgia,serif;margin:7px 0}.live-head p{margin:0;color:#c9d8df;max-width:620px;line-height:1.5}.live-badge{background:#f0bc63;color:#102b42;padding:9px 13px;border-radius:999px;font-size:.72rem;font-weight:900;white-space:nowrap}.live-grid{padding:14px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px}.live-shot{position:relative;border-radius:16px;overflow:hidden;min-height:330px;background:#15374b}.live-shot img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;filter:saturate(1.08) contrast(1.04);transform:scale(1.01)}.live-shot:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(3,18,30,.88))}.live-caption{position:absolute;z-index:2;left:17px;right:17px;bottom:16px}.live-caption strong{display:block;font:400 1.35rem Georgia,serif}.live-caption span{display:block;margin-top:5px;font-size:.72rem;color:#d9e4e8;text-transform:uppercase;letter-spacing:.08em}.fun-update{margin:0 14px 14px;padding:18px 20px;border:1px solid rgba(240,188,99,.35);border-radius:16px;background:rgba(240,188,99,.08);display:flex;align-items:center;gap:14px}.fun-emoji{font-size:2rem}.fun-update strong{display:block;color:#f0bc63}.fun-update p{margin:3px 0 0;color:#d8e3e7;font-size:.9rem}.photo-note{padding:0 20px 22px;color:#9fb2bc;font-size:.78rem}.live-gallery .loading{opacity:.25}\n@media(max-width:800px){.live-head{align-items:start;flex-direction:column}.live-grid{grid-template-columns:1fr 1fr}.live-shot{min-height:280px}.live-shot:last-child{grid-column:1/-1;min-height:260px}.live-badge{align-self:flex-start}}@media(max-width:520px){.live-grid{grid-template-columns:1fr}.live-shot,.live-shot:last-child{grid-column:auto;min-height:340px}.fun-update{align-items:flex-start}.photo-jump{font-size:.68rem}}\n'''
              s=s.replace('</style>',css+'</style>')
              section='''\n<section class="live-gallery" id="photos-updates" aria-label="Trip photos and live updates"><div class="live-head"><div><div class="live-kicker">Live from Nautilus · Aug 15</div><h2>Photos & Updates</h2><p>The trip is officially underway. This is the easy-to-find home for the photos, random yacht lore and whatever happens next.</p></div><div class="live-badge">● LIVE-ish</div></div><div class="live-grid"><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo1.b64" alt="Friends at dinner aboard the yacht"><figcaption class="live-caption"><strong>Dinner, but make it yacht</strong><span>Night one · table energy</span></figcaption></figure><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo2.b64" alt="Sunset drink on the yacht"><figcaption class="live-caption"><strong>Golden hour understood the assignment</strong><span>Sunset · somewhere in the Adriatic</span></figcaption></figure><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo3.b64" alt="Friends relaxing with wine on deck"><figcaption class="live-caption"><strong>Rosé, sea breeze, zero urgency</strong><span>Deck life · current operating model</span></figcaption></figure></div><div class="fun-update"><div class="fun-emoji">🎧</div><div><strong>DJ BOOTH UPDATE</strong><p>Shreya has the aux now. The yacht entertainment department has officially changed leadership.</p></div></div><div class="photo-note">More photos and ridiculous updates can keep stacking here as the trip goes on.</div></section>\n'''
              s=s.replace('</main>',section+'</main>')
              js='''\n<script>document.querySelectorAll('[data-b64]').forEach(async img=>{try{const b=await fetch(img.dataset.b64).then(r=>r.text());img.src='data:image/webp;base64,'+b.trim();img.classList.remove('loading')}catch(e){img.alt+=' (photo loading unavailable)'}});</script>\n'''
              s=s.replace('</body>',js+'</body>')
              p.write_text(s)
      - name: Commit published gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add live Photos & Updates gallery"
          git push
