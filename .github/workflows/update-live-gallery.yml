name: Update live trip gallery

on:
  push:
    paths:
      - 'image-chunks/GALLERY_UPDATE_TRIGGER'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh photo gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          old_css = ".live-grid{padding:14px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px}.live-shot{position:relative;border-radius:16px;overflow:hidden;min-height:330px;background:#15374b;margin:0}.live-shot img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center;filter:none;transform:none;image-rendering:auto}"
          new_css = ".live-grid{padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.live-shot{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:#15374b;margin:0}.live-shot img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center 38%;filter:none;transform:none;image-rendering:auto}"
          s = s.replace(old_css, new_css)

          old_media = "@media(max-width:800px){.live-head{align-items:start;flex-direction:column}.live-grid{grid-template-columns:1fr 1fr}.live-shot{min-height:280px}.live-shot:last-child{grid-column:1/-1;min-height:260px}.live-badge{align-self:flex-start}}@media(max-width:520px){.live-grid{grid-template-columns:1fr}.live-shot,.live-shot:last-child{grid-column:auto;min-height:0;height:clamp(330px,92vw,430px);margin:0}.live-caption strong{font-size:1.18rem}.live-caption span{font-size:.66rem}.fun-update{align-items:flex-start}.photo-jump{font-size:.68rem}}"
          new_media = "@media(max-width:900px){.live-head{align-items:start;flex-direction:column}.live-grid{grid-template-columns:1fr 1fr}.live-badge{align-self:flex-start}}@media(max-width:520px){.live-grid{grid-template-columns:1fr}.live-shot{aspect-ratio:3/4;margin:0}.live-caption strong{font-size:1.18rem}.live-caption span{font-size:.66rem}.fun-update{align-items:flex-start}.photo-jump{font-size:.68rem}}"
          s = s.replace(old_media, new_media)

          gallery = '''<section class="live-gallery" id="photos-updates" aria-label="Trip photos and live updates"><div class="live-head"><div><div class="live-kicker">Live from Nautilus · Aug 16</div><h2>Photos & Updates</h2><p>The trip is officially underway. This is the easy-to-find home for the photos, random yacht lore and whatever happens next.</p></div><div class="live-badge">● LIVE-ish</div></div><div class="live-grid"><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo1.b64" alt="" aria-label="Friends at dinner aboard the yacht"><figcaption class="live-caption"><strong>Dinner, but make it yacht</strong><span>Night one · table energy</span></figcaption></figure><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo2.b64" alt="" aria-label="Sunset drink on the yacht"><figcaption class="live-caption"><strong>Golden hour understood the assignment</strong><span>Sunset · somewhere in the Adriatic</span></figcaption></figure><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo3.b64" alt="" aria-label="Friends relaxing with wine on deck"><figcaption class="live-caption"><strong>Rosé, sea breeze, zero urgency</strong><span>Deck life · current operating model</span></figcaption></figure><figure class="live-shot"><img class="loading" data-b64="image-chunks/photo4.b64" alt="" aria-label="Guest at the yacht DJ booth"><figcaption class="live-caption"><strong>The booth now has a waitlist</strong><span>Day two · DJ deck takeover</span></figcaption></figure></div><div class="fun-update"><div class="fun-emoji">🎧</div><div><strong>DJ BOOTH UPDATE</strong><p>Shreya has the aux now. Apparently yacht DJ access has also become an open-enrollment benefit.</p></div></div><div class="photo-note">More photos and ridiculous updates can keep stacking here as the trip goes on.</div></section>'''
          s, n = re.subn(r'<section class="live-gallery" id="photos-updates".*?</section>', gallery, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Gallery section not found exactly once')

          p.write_text(s)
          PY
      - name: Commit gallery update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh live gallery with latest yacht photo"
          git push
