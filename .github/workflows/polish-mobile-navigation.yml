name: Polish mobile itinerary navigation

on:
  push:
    paths:
      - '.github/workflows/polish-mobile-navigation.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Metadata.
          title = '<title>Croatia Trip 2026</title>'
          metadata = title + '\n<meta name="description" content="The shared day-by-day itinerary for our August 2026 Croatia yacht trip.">\n<meta name="theme-color" content="#092a45">'
          if '<meta name="description"' not in s:
              if title not in s:
                  raise SystemExit('Title marker missing')
              s = s.replace(title, metadata, 1)

          # Focus visibility and screen-reader helper.
          footer_css = '.footer{text-align:center;color:#68767e;font-size:.8rem;padding:0 20px 38px}'
          focus_css = footer_css + '\n.day-tab:focus-visible,.control:focus-visible,.map:focus-visible,.nav a:focus-visible,.route-card a:focus-visible{outline:3px solid rgba(214,162,77,.72);outline-offset:3px}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}'
          if '.day-tab:focus-visible' not in s:
              if footer_css not in s:
                  raise SystemExit('Footer CSS marker missing')
              s = s.replace(footer_css, focus_css, 1)

          # Make the horizontal day selector discoverable and sticky on phones/tablets.
          old_media = '@media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.sidebar-title{min-width:180px}.day-tab{min-width:205px;grid-template-columns:28px minmax(0,1fr);scroll-snap-align:start}.day-tab img{display:none}.day-panel{grid-template-columns:1fr}.photo-wrap{min-height:520px;order:-1}.copy{padding:27px}.route{grid-template-columns:1fr 1fr}}\n@media(max-width:700px){.hero{height:285px}.nav{height:68px;padding:0 18px}.links,.group{display:none}.brand{font-size:1rem}.brand-icon{font-size:1.6rem}.hero-title{padding:38px 22px}.hero h1{font-size:clamp(3.25rem,14vw,4.7rem);white-space:nowrap}.hero p{font-size:.86rem;letter-spacing:.15em}.shell{padding:14px 10px 34px;margin:-18px auto 0}.sidebar-title{display:none}.day-tab{min-width:182px;padding:14px 12px}.panel{padding:9px}.photo-wrap{min-height:390px}.copy{padding:23px 18px 20px}.copy h2{font-size:2.7rem}.route{grid-template-columns:1fr}}'
          new_media = '@media(max-width:1050px){.layout{grid-template-columns:1fr;position:relative}.sidebar{display:flex;position:sticky;top:0;z-index:30;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(10,38,58,.13)}.sidebar::-webkit-scrollbar{display:none}.sidebar-title{min-width:180px}.day-tab{flex:0 0 190px;min-width:190px;grid-template-columns:28px minmax(0,1fr);scroll-snap-align:center;scroll-snap-stop:always}.day-tab img{display:none}.day-panel{grid-template-columns:1fr}.photo-wrap{min-height:520px;order:-1}.copy{padding:27px}.route{grid-template-columns:1fr 1fr}}\n@media(max-width:700px){.hero{height:285px}.nav{height:68px;padding:0 18px}.links,.group{display:none}.brand{font-size:1rem}.brand-icon{font-size:1.6rem}.hero-title{padding:38px 22px}.hero h1{font-size:clamp(3.25rem,14vw,4.7rem);white-space:nowrap}.hero p{font-size:.86rem;letter-spacing:.15em}.shell{padding:14px 10px 34px;margin:-18px auto 0}.sidebar{top:0;border-radius:16px;margin-bottom:12px}.sidebar-title{display:none}.day-tab{flex-basis:154px;min-width:154px;padding:12px 10px}.day-tab strong{font-size:.86rem}.day-tab small{font-size:.63rem}.day-tab em{font-size:.75rem}.panel{padding:9px}.photo-wrap{min-height:390px}.copy{padding:23px 18px 20px}.copy h2{font-size:2.7rem}.route{grid-template-columns:1fr}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.day-tab{transition:none}}'
          if 'scroll-snap-stop:always' not in s:
              if old_media not in s:
                  raise SystemExit('Responsive CSS marker missing')
              s = s.replace(old_media, new_media, 1)

          # Selector semantics.
          old_aside = '<aside class="sidebar"><div class="sidebar-title">'
          new_aside = '<aside class="sidebar" aria-label="Choose an itinerary day"><div class="sidebar-title">'
          if 'aria-label="Choose an itinerary day"' not in s:
              if old_aside not in s:
                  raise SystemExit('Sidebar marker missing')
              s = s.replace(old_aside, new_aside, 1)

          # Defer offscreen images while prioritizing the initially visible image.
          s = re.sub(r'<img src="([^\"]+\.webp)" alt="">', r'<img src="\1" alt="" loading="lazy" decoding="async">', s)
          photos = list(re.finditer(r'<img class="photo" src="([^\"]+)" alt="([^\"]*)">', s))
          if photos:
              if len(photos) != 9:
                  raise SystemExit(f'Expected 9 unoptimized main photos, found {len(photos)}')
              for i, match in reversed(list(enumerate(photos))):
                  attrs = ' fetchpriority="high" decoding="async"' if i == 0 else ' loading="lazy" decoding="async"'
                  replacement = f'<img class="photo" src="{match.group(1)}" alt="{match.group(2)}"{attrs}>'
                  s = s[:match.start()] + replacement + s[match.end():]

          # Auto-center the active day; support keyboard arrows; return to the card after day changes.
          if 'function activate(index,moveFocus,returnToCard)' not in s:
              script = '''
<script>
(function(){
  const radios=Array.from(document.querySelectorAll('.day-radio'));
  const tabs=Array.from(document.querySelectorAll('.day-tab'));
  const panels=Array.from(document.querySelectorAll('.day-panel'));
  const selector=document.querySelector('.sidebar');
  const panelShell=document.querySelector('.panel');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');

  function motion(){return reduceMotion.matches?'auto':'smooth'}
  function activate(index,moveFocus,returnToCard){
    const radio=radios[index];
    if(!radio)return;
    radio.checked=true;
    tabs.forEach((tab,i)=>{
      const active=i===index;
      tab.setAttribute('aria-selected',String(active));
      tab.setAttribute('tabindex',active?'0':'-1');
    });
    panels.forEach((panel,i)=>panel.setAttribute('aria-hidden',String(i!==index)));
    if(window.innerWidth<=1050){
      tabs[index].scrollIntoView({behavior:motion(),block:'nearest',inline:'center'});
    }
    if(moveFocus)tabs[index].focus({preventScroll:true});
    if(returnToCard&&panelShell){
      const offset=window.innerWidth<=1050?(selector.offsetHeight+12):24;
      const top=panelShell.getBoundingClientRect().top+window.scrollY-offset;
      window.scrollTo({top:Math.max(0,top),behavior:motion()});
    }
  }

  tabs.forEach((tab,index)=>{
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-controls','itinerary-day-'+(index+1));
    tab.addEventListener('keydown',event=>{
      let next=index;
      if(event.key==='ArrowRight')next=(index+1)%tabs.length;
      else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
      else if(event.key==='Home')next=0;
      else if(event.key==='End')next=tabs.length-1;
      else if(event.key==='Enter'||event.key===' '){event.preventDefault();activate(index,false,true);return}
      else return;
      event.preventDefault();
      activate(next,true,true);
    });
  });
  panels.forEach((panel,index)=>{panel.id='itinerary-day-'+(index+1);panel.setAttribute('role','tabpanel')});
  radios.forEach((radio,index)=>radio.addEventListener('change',()=>activate(index,false,true)));
  activate(Math.max(0,radios.findIndex(radio=>radio.checked)),false,false);
})();
</script>'''
              if '\n</body></html>' not in s:
                  raise SystemExit('Closing body marker missing')
              s = s.replace('\n</body></html>', script + '\n</body></html>', 1)

          # Refuse any regression to the confirmed itinerary or protected Day 4 cheetah image.
          required = [
              'Restaurant Adriatic at 8:00 PM',
              'Nick & Matilda’s Anniversary at Fort George',
              'Jake fully committed to cheetah attire',
              '<img class="photo" src="day3.webp" alt="Black, White and Boat Games" loading="lazy" decoding="async">',
              'Filippi at 7:30 PM',
              'Drinks & Dinner at Hula Hula',
              'Don Quijote</strong><div>Thursday, August 20 · 8:00 PM',
              'AC Hotel by Marriott Split ↗',
              'exact marina/berth to be confirmed',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Validation failed: ' + repr(missing))
          if s.count('class="day-tab"') != 9 or s.count('class="day-panel panel-') != 9:
              raise SystemExit('Day count validation failed')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflows and commit
        run: |
          rm -f .github/workflows/update-hvar-itinerary.yml
          rm -f .github/workflows/polish-mobile-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Polish mobile itinerary navigation"
          git push
