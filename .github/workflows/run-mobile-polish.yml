name: Run mobile itinerary polish

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute validated polish script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/polish-mobile-navigation.yml').read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Apply and validate polish\n        run: \|\n(.*?)\n      - name: Remove one-time workflows and commit",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('Could not locate validated polish step')
          lines = match.group(1).splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-polish.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-polish.sh
      - name: Clean up and publish
        run: |
          rm -f .github/workflows/update-hvar-itinerary.yml
          rm -f .github/workflows/polish-mobile-navigation.yml
          rm -f .github/workflows/run-mobile-polish.yml
          rm -f .github/workflows/trigger-mobile-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Polish mobile itinerary navigation"
          git push
